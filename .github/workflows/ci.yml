name: Student API CI

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'migrate.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

name: Student API CI

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'migrate.py'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: student_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: student_api_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Run database migrations
        run: python migrate.py

      - name: Test
        run: make test
